apiVersion: 1
datasources:
  - name: InfluxDB SparkPlug
    uid: influx-sparkplug
    type: influxdb
    access: proxy
    url: http://influxdb:8086
    isDefault: true
    jsonData:
      version: Flux
      organization: srh
      defaultBucket: sparkplug
    secureJsonData:
      token: sparkplug-token
